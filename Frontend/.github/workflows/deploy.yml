name: Deploy to VPS

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            
            echo "=== SkyStar Deploy Started ==="
            
            cd /var/www/balon
            
            # Pull latest code
            git fetch --all
            git reset --hard origin/master || git reset --hard origin/main
            
            # Build frontend app
            cd app
            npm install
            npm run build
            
            # Restart ONLY skystar-balon (port 3001)
            PORT=3001 pm2 restart skystar-balon
            pm2 save
            
            echo "=== Deploy Complete ==="
            pm2 list
