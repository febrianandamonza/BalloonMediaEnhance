services:
  # ===== PostgreSQL 16 =====
  postgres:
    image: postgres:16-alpine
    container_name: skystar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skystar_geoint
      POSTGRES_USER: skystar
      POSTGRES_PASSWORD: skystar_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U skystar -d skystar_geoint" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis 7 =====
  redis:
    image: redis:7-alpine
    container_name: skystar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== NestJS Backend =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skystar-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://skystar:skystar_secret_2026@postgres:5432/skystar_geoint?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-skystar-geoint-jwt-secret-2026-production}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-skystar-geoint-refresh-secret-2026-production}
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== Next.js Frontend =====
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: skystar-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:8000
    depends_on:
      - backend

  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    container_name: skystar-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
